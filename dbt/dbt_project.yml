# dbt/dbt_project.yml
name: 'fraud_analysis'
version: '1.0.0'
config-version: 2

profile: 'clickhouse_profile' 

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  fraud_analysis:
    +materialized: table
    staging:
      +materialized: view
    marts:
      +materialized: table